<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4e7d5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="測驗平台">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<title>測驗平台</title>
<style>
  :root { --bg:#f4efdf; --card:#fffdf6; --text:#2d2a22; --muted:#7b7667; --line:#e4dcc6;
          --primary:#4e7d5b; --primary-dark:#3f6a4b; --gold:#d9a21b; --ok:#3f7a4e; --okbg:#e8f1e6; --bad:#b4453a; --badbg:#f7e5e2;
          --shadow:0 2px 6px rgba(80,60,20,.08); }
  * { box-sizing:border-box; }
  html { color-scheme: light; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 -apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;
         padding-bottom:calc(72px + env(safe-area-inset-bottom)); }
  .wrap { max-width:720px; margin:0 auto; padding:16px 16px 8px; }
  h1 { font-size:26px; font-weight:800; margin:4px 0 2px; letter-spacing:.5px; }
  h2 { font-size:17px; margin:16px 0 8px; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:var(--shadow); }
  .muted { color:var(--muted); font-size:14px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; box-shadow:var(--shadow); }
  .kpi .l { color:var(--muted); font-size:13px; } .kpi .v { font-size:24px; font-weight:800; }
  .kpi .v small { font-size:14px; font-weight:400; color:var(--muted); }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--text);
           padding:10px 14px; border-radius:12px; cursor:pointer; }
  button.primary { background:var(--primary); color:#fff; border-color:var(--primary); }
  button.link { border:none; background:none; color:var(--primary); padding:4px 6px; }
  button:disabled { opacity:.45; cursor:default; }
  button.wide { width:100%; margin-top:8px; padding:13px; font-weight:600; }
  input[type=text], input[type=url] { width:100%; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--text); }
  label.chk { display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); }
  label.chk:last-child { border-bottom:none; }
  label.chk input { width:22px; height:22px; accent-color:var(--primary); }
  .stat { margin-left:auto; font-size:13px; color:var(--muted); white-space:nowrap; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; border:1px solid var(--line); color:var(--muted); background:#fff; }
  .seg { display:flex; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fff; }
  .seg button { border:none; border-radius:0; flex:1; background:transparent; }
  .seg button.on { background:var(--primary); color:#fff; }
  .stem { white-space:pre-wrap; margin-bottom:12px; }
  .obj { font-size:13px; color:var(--muted); background:var(--bg); padding:8px 10px; border-radius:10px; margin-bottom:12px; }
  .opt { display:block; width:100%; text-align:left; margin-bottom:8px; padding:12px 14px; border-radius:12px;
         border:1px solid var(--line); background:#fff; white-space:pre-wrap; }
  .opt.sel { border-color:var(--primary); box-shadow:0 0 0 2px var(--primary) inset; }
  .opt.ok  { border-color:var(--ok); background:var(--okbg); }
  .opt.bad { border-color:var(--bad); background:var(--badbg); }
  .fb { padding:12px; border-radius:12px; margin-top:8px; font-weight:600; }
  .fb.ok { background:var(--okbg); color:var(--ok); } .fb.bad { background:var(--badbg); color:var(--bad); }
  .progress { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-bottom:12px; }
  .progress i { display:block; height:100%; background:var(--primary); }
  .score { font-size:44px; font-weight:800; color:var(--primary); }
  .spin { text-align:center; padding:40px; color:var(--muted); }
  .err { color:var(--bad); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { padding:8px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  .sess { cursor:pointer; } .sess:active { background:var(--bg); }
  .score-s { font-weight:800; font-size:18px; }
  .topbar { display:flex; justify-content:space-between; align-items:flex-start; }
  .star { color:var(--gold); }
  /* 底部分頁列 */
  .tabbar { position:fixed; left:0; right:0; bottom:0; background:#ece5cf; border-top:1px solid var(--line);
            display:flex; justify-content:space-around; padding:6px 0 calc(6px + env(safe-area-inset-bottom)); z-index:10; }
  .tabbar button { flex:1; border:none; background:none; border-radius:0; padding:4px 0; color:var(--muted); font-size:12px; display:flex; flex-direction:column; align-items:center; gap:2px; }
  .tabbar button svg { width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .tabbar button.on { color:var(--primary); font-weight:700; }
  .timer { font-weight:700; font-variant-numeric:tabular-nums; } .timer.low { color:var(--bad); }
  /* 教材關鍵句與整頁原文 */
  .keys { margin-top:10px; border-top:1px dashed var(--line); padding-top:10px; }
  .keys .t { font-size:13px; color:var(--muted); margin-bottom:6px; }
  .key { background:#fff6d6; border-left:4px solid var(--gold); border-radius:8px; padding:8px 10px; margin-bottom:6px; font-size:15px; line-height:1.6; }
  .key .pg { color:var(--muted); font-size:12px; margin-left:4px; white-space:nowrap; }
  .key.w { background:#fbeeeb; border-left-color:var(--bad); }
  .wopt { font-size:13px; color:var(--text); margin:8px 0 4px; font-weight:600; }
  mark { background:#ffe28a; color:inherit; padding:0 2px; border-radius:3px; }
  .ovl { position:fixed; inset:0; background:var(--bg); z-index:20; overflow:auto; -webkit-overflow-scrolling:touch; padding:12px 16px calc(24px + env(safe-area-inset-bottom)); display:none; }
  .ovl.on { display:block; }
  .ovl .bar { position:sticky; top:0; background:var(--bg); padding:6px 0 10px; display:flex; justify-content:space-between; align-items:center; gap:8px; z-index:1; }
  .ovl .page { white-space:pre-wrap; line-height:1.9; font-size:16px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:var(--shadow); max-width:720px; margin:0 auto; }
  .ovl .nav { display:flex; justify-content:space-between; max-width:720px; margin:12px auto 0; }
  .sr { display:flex; gap:8px; } .sr input { flex:1; }
  .hit { cursor:pointer; } .hit .sn { font-size:14px; color:var(--text); margin-top:4px; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="spin">載入中…</div></div>
<div class="ovl" id="ovl"></div>
<nav class="tabbar" id="tabbar">
  <button data-tab="home" onclick="loadHome()"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>首頁</button>
  <button data-tab="wrong" onclick="startQuiz(true)"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M9 9l6 6M15 9l-6 6"/></svg>錯題</button>
  <button data-tab="history" onclick="loadHistory()"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="M8 15l3-4 3 2 5-6"/></svg>紀錄</button>
  <button data-tab="book" onclick="renderSearch()"><svg viewBox="0 0 24 24"><path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/></svg>教材</button>
  <button data-tab="settings" onclick="renderSettings()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>設定</button>
</nav>

<script src="config.js"></script>
<script>
// ---------- 設定 ----------
// 網址來自 config.js（不是祕密）；裝置授權碼每台裝置填一次，存在這台裝置的 localStorage。
var CFG_KEY = 'quiz-platform.config';
function loadCfg(){
  var c = {}; try { c = JSON.parse(localStorage.getItem(CFG_KEY)||'{}'); } catch(e){}
  if (!c.apiUrl && window.QP_CONFIG && window.QP_CONFIG.apiUrl) c.apiUrl = window.QP_CONFIG.apiUrl;
  return c;
}
function saveCfg(c){ try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); } catch(e){} }
var cfg = loadCfg();
// 透過 QR / 連結設定：…/web/#code=XXXXX-XXXXX-XXXXX-XXXXX → 存起來並把授權碼從網址移除
(function(){
  var m = (location.hash||'').match(/[#&]code=([A-Za-z0-9-]{16,})/);
  if (m){ cfg.token = m[1].toUpperCase(); saveCfg(cfg); try { history.replaceState(null, '', location.pathname + location.search); } catch(e){ location.hash=''; } }
})();

var state = { meta:null, subject:null, chapters:{}, source:'all', mode:'practice', shuffleQ:false, shuffleO:false,
              queue:[], idx:0, answers:{}, session:null, onlyWrong:false, mock:false, mockMin:120, deadline:null, timer:null };

var curTab='home';
function $(html, tab){ document.getElementById('app').innerHTML = html; window.scrollTo(0,0);
  if (tab) curTab=tab; document.querySelectorAll('#tabbar button').forEach(function(b){ b.classList.toggle('on', b.dataset.tab===curTab); }); }
function today(){ var d=new Date(), w='日一二三四五六'[d.getDay()]; return (d.getMonth()+1)+'/'+d.getDate()+'（'+w+'）'; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

// ---------- API ----------
function apiGet(action, params){
  var q = Object.assign({ token: cfg.token, action: action }, params||{});
  var qs = Object.keys(q).filter(function(k){ return q[k]!==undefined && q[k]!==null && q[k]!==''; })
             .map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(q[k]); }).join('&');
  return fetch(cfg.apiUrl+'?'+qs, { method:'GET', redirect:'follow' }).then(parse_);
}
function apiPost(action, payload){
  var body = Object.assign({ token: cfg.token, action: action }, payload||{});
  // text/plain 避免 CORS 預檢，Apps Script 端用 JSON.parse 讀
  return fetch(cfg.apiUrl, { method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) }).then(parse_);
}
function parse_(r){
  return r.text().then(function(t){
    var j; try { j = JSON.parse(t); } catch(e){ throw new Error('API 回傳的不是 JSON，請確認網址正確且部署為「任何人」可存取。'); }
    if (!j.ok){ var err = new Error(j.error==='unauthorized' ? '這台裝置的授權碼無效或已被停用' : (j.error || 'API 錯誤')); err.unauthorized = (j.error==='unauthorized'); throw err; }
    return j.data;
  });
}
function fail(e){
  if (e && e.unauthorized) return renderSettings(e.message);
  $('<div class="card err">發生錯誤：'+esc(e && e.message || e)+'</div><button class="wide" onclick="loadHome()">重試</button><button class="wide" onclick="renderSettings()">設定</button>');
}

// ---------- 設定頁 ----------
function renderSettings(msg){
  var has = !!cfg.token;
  $('<h1>設定</h1>'
   +'<div class="card"><b>裝置授權碼</b>'
   +(has && !window._changeCode
      ? '<div class="muted" style="margin:6px 0 10px">這台裝置已授權（…'+esc(String(cfg.token).slice(-5))+'）。</div>'
        +'<button onclick="window._changeCode=true;renderSettings()">更換授權碼</button> '
        +'<button onclick="if(confirm(\'移除這台裝置的授權碼？之後要重新輸入才能使用。\')){cfg.token=\'\';saveCfg(cfg);renderSettings();}" style="color:var(--bad)">移除</button>'
      : '<div class="muted" style="margin:6px 0 10px">每台裝置第一次使用時輸入一次就好。授權碼在試算表選單「測驗平台 → 新增裝置授權碼」產生；用相機掃那裡的 QR code 可以直接完成設定、不用打字。</div>'
        +'<input type="text" id="token" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="XXXXX-XXXXX-XXXXX-XXXXX" value="">')
   +(msg?'<div class="muted err" style="margin-top:8px">'+esc(msg)+'</div>':'')
   +'</div>'
   +'<details class="card" style="padding:12px 16px"><summary class="muted" style="cursor:pointer">連線設定（通常不用改）</summary>'
   +'<p><b>API 網址</b><br><input type="url" id="apiUrl" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(cfg.apiUrl||'')+'"></p>'
   +'<div class="muted">預設來自 config.js；只有後端重新部署到不同網址時才需要改。</div></details>'
   +((!has || window._changeCode) ? '<button class="primary wide" onclick="saveSettings()">儲存並連線</button>' : '<button class="primary wide" onclick="saveSettings()">測試連線</button>')
   +(has?'<button class="wide" onclick="window._changeCode=false;loadHome()">返回</button>':''),'settings');
  var el = document.getElementById('token'); if (el) setTimeout(function(){ el.focus(); }, 50);
}
function saveSettings(){
  var url = (document.getElementById('apiUrl').value||'').trim();
  var tEl = document.getElementById('token');
  var tok = tEl ? tEl.value.trim().toUpperCase() : cfg.token;
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)) return renderSettings('網址格式不對，應該是 https://script.google.com/macros/s/…/exec');
  if (!tok) return renderSettings('請輸入裝置授權碼');
  var old = cfg; cfg = { apiUrl: url, token: tok };
  $('<div class="spin">連線測試中…</div>');
  apiGet('ping').then(function(){ saveCfg(cfg); window._changeCode=false; loadHome(); })
    .catch(function(e){ cfg = old; renderSettings('連線失敗：'+(e.message||e)); });
}

// ---------- 首頁 ----------
function loadHome(){
  stopTimer();
  if (!cfg.apiUrl || !cfg.token) return renderSettings();
  $('<div class="spin">載入中…</div>');
  apiGet('meta').then(function(m){
    state.meta = m;
    if (!state.subject || !m.subjects.some(function(s){return s.name===state.subject;})) state.subject = m.subjects.length ? m.subjects[0].name : null;
    renderHome();
  }).catch(fail);
}
function curSubject(){ return state.meta.subjects.filter(function(s){return s.name===state.subject;})[0]; }

function renderHome(){
  var m = state.meta;
  var h = '<h1>測驗平台</h1><div class="sub">'+today()+' · 更新於 '+('0'+new Date().getHours()).slice(-2)+':'+('0'+new Date().getMinutes()).slice(-2)+'</div>';
  if (!m.subjects.length){ $(h+'<div class="card">題庫是空的，請先在「題庫」工作表新增題目。</div>','home'); return; }
  var s = curSubject();
  var answered = s.chapters.reduce(function(a,c){ return a+c.answered; },0);
  h += '<div class="row" style="margin-bottom:10px">';
  m.subjects.forEach(function(x){ h += '<button class="'+(x.name===state.subject?'primary':'')+'" onclick="pickSubject(\''+esc(x.name)+'\')">'+esc(x.name)+'</button>'; });
  h += '</div>';
  h += '<div class="kpis"><div class="kpi"><div class="l">總題數</div><div class="v">'+s.total+'</div></div>'
     + '<div class="kpi"><div class="l">已作答</div><div class="v">'+answered+' <small>/ '+s.total+'</small></div></div>'
     + '<div class="kpi"><div class="l">目前錯題</div><div class="v" style="color:var(--bad)">'+s.wrong+'</div></div></div>';

  h += '<div class="card"><div class="row" style="justify-content:space-between"><b>選擇章節</b>'
     + '<span><button onclick="selAll(true)">全選</button> <button onclick="selAll(false)">清除</button></span></div>';
  s.chapters.forEach(function(c){
    var rate = c.answered ? Math.round(100*c.correct/c.answered)+'%' : '未作答';
    h += '<label class="chk"><input type="checkbox" '+(state.chapters[c.chapter]?'checked':'')+' onchange="toggleCh('+c.chapter+',this.checked)">'
       + '<span><span class="star">★</span> 第 '+c.chapter+' 章 <span class="pill">練習 '+c.practice+'</span> <span class="pill">模擬 '+c.mock+'</span></span>'
       + '<span class="stat">'+rate+(c.wrong?' · 錯 '+c.wrong:'')+'</span></label>';
  });
  h += '</div>';

  h += '<div class="card"><b>題目來源</b><div class="seg" style="margin:8px 0 14px">'
     + segBtn('source','all','全部') + segBtn('source','練習題','練習題') + segBtn('source','模擬試題','模擬試題') + '</div>'
     + '<b>模式</b><div class="seg" style="margin:8px 0 14px">'
     + segBtn('mode','practice','練習：每題立即看答案') + segBtn('mode','exam','測驗：全部答完再對答案') + '</div>'
     + '<div class="row"><span style="flex:1"><b>題目順序</b><div class="seg" style="margin-top:6px">' + segBtn('shuffleQ',false,'依序') + segBtn('shuffleQ',true,'隨機') + '</div></span>'
     + '<span style="flex:1"><b>選項順序</b><div class="seg" style="margin-top:6px">' + segBtn('shuffleO',false,'固定') + segBtn('shuffleO',true,'打亂') + '</div></span></div></div>';

  var n = selectedChapters().length;
  var wrongSel = n ? s.chapters.filter(function(c){ return state.chapters[c.chapter]; }).reduce(function(a,c){ return a+c.wrong; },0) : s.wrong;
  var mockN = s.chapters.reduce(function(a,c){ return a+c.mock; },0);
  h += '<button class="primary wide" '+(n?'':'disabled')+' onclick="startQuiz(false)">開始（'+n+' 章）</button>'
     + '<button class="wide" '+(wrongSel?'':'disabled')+' onclick="startQuiz(true)">只重練錯題（'+wrongSel+' 題'+(n?'，勾選的章節':'，全部章節')+'）</button>';
  h += '<div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between"><b>模擬考</b><span class="muted">'+mockN+' 題 · 隨機順序 · 70 分及格</span></div>'
     + '<div class="row" style="margin-top:8px"><span class="muted">作答時間</span><div class="seg" style="flex:1">' + segBtn('mockMin',60,'60 分') + segBtn('mockMin',90,'90 分') + segBtn('mockMin',120,'120 分') + '</div></div>'
     + '<button class="primary wide" '+(mockN?'':'disabled')+' onclick="startMock()">開始模擬考</button></div>';
  $(h,'home');
}
function segBtn(key,val,label){ var v = typeof val==='string' ? "'"+val+"'" : String(val); return '<button class="'+(state[key]===val?'on':'')+'" onclick="state.'+key+'='+v+';renderHome()">'+label+'</button>'; }
function pickSubject(n){ state.subject=n; state.chapters={}; renderHome(); }
function toggleCh(c,on){ state.chapters[c]=on; renderHome(); }
function selAll(on){ curSubject().chapters.forEach(function(c){ state.chapters[c.chapter]=on; }); renderHome(); }
function selectedChapters(){ return Object.keys(state.chapters).filter(function(k){return state.chapters[k];}).map(Number); }

// ---------- 測驗 ----------
function newSession(){ return new Date().toISOString().replace(/[-:T]/g,'').slice(0,14); }
function shuffle(a){ for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function prepare(qs){
  qs.forEach(function(q){ var idx = q.options.map(function(_,i){ return i; }); q.perm = (state.shuffleO && !fixedOrder(q)) ? shuffle(idx) : idx; });
  return qs;
}
// 選項順序有意義的題目不打亂：「以上皆是」類、A/B 陳述組合題、是非題、題目裡提到選項編號的題目
function fixedOrder(q){
  if (q.options.length <= 2) return true;
  if (/選項（[1-5１-５]）|（[1-5１-５]）到（[1-5１-５]）/.test(q.stem)) return true;
  return q.options.some(function(o){
    o = String(o).trim();
    return /^(以上|上述)/.test(o) || /(以上|上述).{0,8}(各項|選項|所有|全部|都|皆)/.test(o)
        || /^(只|僅)?包括 ?(案例|情形|行為|陳述)? ?[A-D]/.test(o) || /^既不/.test(o);
  });
}
function startQuiz(onlyWrong){
  state.onlyWrong = onlyWrong; state.mock = false; stopTimer();
  $('<div class="spin">出題中…</div>');
  apiGet('questions', { subject:state.subject, chapters: selectedChapters().join(','), source: onlyWrong?'all':state.source, onlyWrong: onlyWrong?1:0, shuffle: state.shuffleQ?1:0 })
  .then(function(qs){
    if (!qs.length){ $('<div class="card">沒有符合條件的題目。</div><button class="wide" onclick="renderHome()">回首頁</button>'); return; }
    state.queue=prepare(qs); state.idx=0; state.answers={}; state.session=newSession();
    curTab = onlyWrong?'wrong':'home';
    renderQ();
  }).catch(fail);
}
function startMock(){
  if (!confirm('開始模擬考？'+state.mockMin+' 分鐘內作答全部模擬試題，時間到自動交卷。')) return;
  state.onlyWrong = false; state.mock = true; state.mode = 'exam'; stopTimer();
  $('<div class="spin">出題中…</div>');
  apiGet('questions', { subject:state.subject, chapters:'', source:'模擬試題', onlyWrong:0, shuffle:1 })
  .then(function(qs){
    if (!qs.length){ $('<div class="card">沒有模擬試題。</div><button class="wide" onclick="renderHome()">回首頁</button>'); return; }
    var so = state.shuffleO; state.shuffleO = true; state.queue=prepare(qs); state.shuffleO = so;
    state.idx=0; state.answers={}; state.session=newSession();
    state.deadline = Date.now() + state.mockMin*60000;
    state.timer = setInterval(tick, 1000);
    curTab='home'; renderQ();
  }).catch(fail);
}
function stopTimer(){ if (state.timer){ clearInterval(state.timer); state.timer=null; } state.deadline=null; }
function remain(){ return Math.max(0, Math.floor((state.deadline - Date.now())/1000)); }
function fmt(sec){ var m=Math.floor(sec/60), s=sec%60; return m+':'+('0'+s).slice(-2); }
function tick(){
  var el=document.getElementById('timer'); var r=remain();
  if (el){ el.textContent='⏱ '+fmt(r); el.classList.toggle('low', r<300); }
  if (r<=0){ stopTimer(); alert('時間到，自動交卷。'); finish(true); }
}

function renderQ(){
  var q = state.queue[state.idx], a = state.answers[q.id];
  var reveal = (state.mode==='practice' && a!==undefined);
  var left = state.mock ? '模擬考' : esc(state.subject)+' · 第 '+q.chapter+' 章 · '+esc(q.source)+' '+esc(q.id);
  var right = (state.mock ? '<span id="timer" class="timer'+(remain()<300?' low':'')+'">⏱ '+fmt(remain())+'</span> · ' : '') + (state.idx+1)+' / '+state.queue.length;
  var h = '<div class="muted row" style="justify-content:space-between"><span>'+left+'</span><span>'+right+'</span></div>';
  h += '<div class="progress"><i style="width:'+Math.round(100*(state.idx)/state.queue.length)+'%"></i></div>';
  h += '<div class="card">';
  if (q.objective) h += '<div class="obj">學習目標：'+esc(q.objective)+'</div>';
  h += '<div class="stem">'+esc(q.stem)+'</div>';
  var perm = q.perm || q.options.map(function(_,i){ return i; });
  perm.forEach(function(oi,i){
    var n=oi+1, cls='opt';
    if (reveal){ if(n===q.answer) cls+=' ok'; else if(n===a) cls+=' bad'; }
    else if (a===n) cls+=' sel';
    h += '<button class="'+cls+'" '+(reveal?'disabled':'')+' onclick="choose('+n+')">（'+(i+1)+'）'+esc(q.options[oi])+'</button>';
  });
  if (reveal){
    var shown = perm.indexOf(q.answer-1)+1;
    h += '<div class="fb '+(a===q.answer?'ok':'bad')+'">'+(a===q.answer?'答對了':'答錯了，正確答案是（'+shown+'）')+'</div>';
    h += keysHtml(q, a);
  }
  h += '</div>';
  h += '<div class="row" style="justify-content:space-between">';
  h += '<button onclick="prevQ()" '+(state.idx===0?'disabled':'')+'>上一題</button>';
  if (state.idx < state.queue.length-1) h += '<button class="primary" onclick="nextQ()" '+(a===undefined?'disabled':'')+'>下一題</button>';
  else h += '<button class="primary" onclick="finish()" '+(a===undefined?'disabled':'')+'>完成</button>';
  h += '</div><div style="text-align:center;margin-top:12px"><button onclick="confirmQuit()">結束測驗</button></div>';
  $(h);
}
function rec(q,n){ return { session:state.session, subject:q.subject, chapter:q.chapter, id:q.id, source:q.source, chosen:n, answer:q.answer, mode: state.mock?'模擬考':(state.mode==='practice'?'練習':'測驗') }; }
function choose(n){
  var q = state.queue[state.idx];
  if (state.mode==='practice' && state.answers[q.id]!==undefined) return;
  state.answers[q.id]=n;
  if (state.mode==='practice') apiPost('answer', { rec: rec(q,n) }).catch(function(e){ console.error(e); });
  renderQ();
}
function nextQ(){ if (state.idx<state.queue.length-1){ state.idx++; renderQ(); } }
function prevQ(){ if (state.idx>0){ state.idx--; renderQ(); } }
function confirmQuit(){ if (confirm('確定結束？已作答的題目會保留紀錄。')) { if (state.mode==='exam') finish(true); else { stopTimer(); loadHome(); } } }

function finish(partial){
  stopTimer();
  if (state.mode==='exam'){
    var recs = state.queue.filter(function(q){ return state.answers[q.id]!==undefined; }).map(function(q){ return rec(q, state.answers[q.id]); });
    if (recs.length) apiPost('answers', { recs: recs }).catch(function(e){ alert('成績儲存失敗：'+e.message); });
  }
  renderResult(partial);
}

function renderResult(partial){
  var total=0, correct=0, wrong=[];
  state.queue.forEach(function(q){ var a=state.answers[q.id]; if(a===undefined) return; total++; if(a===q.answer) correct++; else wrong.push(q); });
  var pct = total?Math.round(100*correct/total):0;
  var h;
  if (state.mock){
    var score = Math.round(correct*100/state.queue.length*10)/10, pass = score>=70;
    h = '<h1>模擬考結果</h1><div class="card" style="text-align:center"><div class="score" style="color:'+(pass?'var(--ok)':'var(--bad)')+'">'+score+' 分</div>'
      + '<div style="font-weight:700;color:'+(pass?'var(--ok)':'var(--bad)')+'">'+(pass?'及格':'不及格')+'（70 分及格）</div>'
      + '<div class="muted">'+correct+' / '+state.queue.length+' 題正確'+(partial?'（未全部作答，未答以 0 分計）':'')+'</div></div>';
  } else {
    h = '<h1>結果</h1><div class="card" style="text-align:center"><div class="score">'+pct+'%</div>'
      + '<div class="muted">'+correct+' / '+total+' 題正確'+(partial?'（未全部作答）':'')+'</div></div>';
  }
  if (wrong.length){
    h += '<h2>答錯的題目</h2>';
    wrong.forEach(function(q){
      h += '<div class="card"><div class="muted">'+esc(q.id)+' · 第 '+q.chapter+' 章</div>'
         + '<div class="stem" style="margin:6px 0">'+esc(q.stem)+'</div>';
      var perm = q.perm || q.options.map(function(_,i){ return i; });
      perm.forEach(function(oi,i){ var n=oi+1; var cls = n===q.answer?'ok':(n===state.answers[q.id]?'bad':'');
        h += '<div class="opt '+cls+'" style="padding:8px 12px">（'+(i+1)+'）'+esc(q.options[oi])+'</div>'; });
      h += keysHtml(q, state.answers[q.id]) + '</div>';
    });
    h += '<button class="primary wide" onclick="retryWrong()">重練這些錯題</button>';
  } else if (total) {
    h += '<div class="card" style="color:var(--ok)">全部答對！</div>';
  }
  h += '<button class="wide" onclick="loadHome()">回首頁</button>';
  $(h);
  window._wrong = wrong;
}
function retryWrong(){ state.mock=false; state.mode='practice'; state.queue = window._wrong; state.idx=0; state.answers={}; state.session=newSession(); renderQ(); }

// ---------- 紀錄 ----------
function loadHistory(){
  $('<div class="spin">載入中…</div>');
  apiGet('history', { subject: state.subject }).then(function(rows){
    var h = '<h1>作答紀錄 · '+esc(state.subject)+'</h1>';
    if (!rows.length) h += '<div class="card muted">尚無紀錄</div>';
    else {
      h += '<div class="muted" style="margin-bottom:8px">點一場可看每一題的作答內容</div>';
      rows.forEach(function(r){ var d=new Date(r.time), pct=Math.round(100*r.correct/r.total);
        h += '<div class="card sess" onclick="showSession(\''+esc(r.session)+'\')">'
           + '<div class="row" style="justify-content:space-between"><b>'+d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+'</b>'
           + '<span class="score-s" style="color:'+(pct>=70?'var(--ok)':'var(--bad)')+'">'+r.correct+'/'+r.total+'（'+pct+'%）</span></div>'
           + '<div class="row" style="justify-content:space-between;margin-top:4px"><span class="muted">第 '+r.chapters.join(', ')+' 章 · '+esc(r.mode)+'</span>'
           + '<span><button class="link">看明細 ›</button><button class="link" style="color:var(--bad)" onclick="event.stopPropagation();deleteSession(\''+esc(r.session)+'\','+r.total+')">刪除</button></span></div></div>'; });
    }
    h += '<button class="wide" onclick="renderHome()">回首頁</button>';
    $(h,'history');
  }).catch(fail);
}

function deleteSession(session, n){
  if (!confirm('刪除這場的 '+n+' 筆作答紀錄？刪除後無法復原。')) return;
  $('<div class="spin">刪除中…</div>','history');
  apiPost('deleteSession', { subject: state.subject, session: session }).then(loadHistory).catch(fail);
}

// 場次明細：每一題的題目、我的答案、正確答案、對錯、教材頁碼
function showSession(session){
  $('<div class="spin">載入中…</div>','history');
  apiGet('sessionDetail', { subject: state.subject, session: session }).then(function(d){
    if (!d.items.length){ $('<div class="card muted">這場沒有紀錄</div><button class="wide" onclick="loadHistory()">回紀錄</button>','history'); return; }
    var first = d.items[0], dt = new Date(first.time), pct = Math.round(100*d.correct/d.total);
    var wrong = d.items.filter(function(i){ return !i.correct; });
    var h = '<div class="muted"><button class="link" onclick="loadHistory()">‹ 作答紀錄</button></div>'
          + '<h1>場次明細</h1><div class="sub">'+dt.getFullYear()+'/'+(dt.getMonth()+1)+'/'+dt.getDate()+' '+('0'+dt.getHours()).slice(-2)+':'+('0'+dt.getMinutes()).slice(-2)+' · '+esc(first.mode)+'</div>'
          + '<div class="kpis"><div class="kpi"><div class="l">題數</div><div class="v">'+d.total+'</div></div>'
          + '<div class="kpi"><div class="l">答對</div><div class="v" style="color:var(--ok)">'+d.correct+'</div></div>'
          + '<div class="kpi"><div class="l">正確率</div><div class="v" style="color:'+(pct>=70?'var(--ok)':'var(--bad)')+'">'+pct+'%</div></div></div>';
    if (wrong.length) h += '<button class="primary wide" style="margin-bottom:12px" onclick="retrySession()">重練這場答錯的 '+wrong.length+' 題</button>';
    d.items.forEach(function(it, n){
      h += '<div class="card" style="border-left:4px solid '+(it.correct?'var(--ok)':'var(--bad)')+'">'
         + '<div class="row" style="justify-content:space-between"><span class="muted">'+(n+1)+'. '+esc(it.id)+' · 第 '+it.chapter+' 章</span>'
         + '<span style="font-weight:700;color:'+(it.correct?'var(--ok)':'var(--bad)')+'">'+(it.correct?'答對':'答錯')+'</span></div>';
      if (it.objective) h += '<div class="obj" style="margin-top:8px">學習目標：'+esc(it.objective)+'</div>';
      h += '<div class="stem" style="margin:8px 0">'+esc(it.stem)+'</div>';
      it.options.forEach(function(o,i){ var k=i+1, cls = k===it.answer?'ok':(k===it.chosen?'bad':'');
        var tag = k===it.answer ? '　✓ 正確答案' : (k===it.chosen ? '　✗ 我的答案' : '');
        h += '<div class="opt '+cls+'" style="padding:8px 12px">（'+k+'）'+esc(o)+'<span class="muted" style="font-size:12px">'+tag+'</span></div>'; });
      h += keysHtml(it, it.chosen) + '</div>';
    });
    h += '<button class="wide" onclick="loadHistory()">回作答紀錄</button>';
    window._detail = d;
    $(h,'history');
  }).catch(fail);
}
function retrySession(){
  var d = window._detail; if (!d) return;
  var qs = d.items.filter(function(i){ return !i.correct; }).map(function(i){
    return { id:i.id, subject:state.subject, chapter:i.chapter, source:i.source, objective:i.objective, stem:i.stem, options:i.options, answer:i.answer, page:i.page, keys:i.keys };
  });
  state.mock=false; state.mode='practice'; state.onlyWrong=true;
  state.queue=prepare(qs); state.idx=0; state.answers={}; state.session=newSession();
  curTab='wrong'; renderQ();
}

// ---------- 教材：關鍵句、整頁原文、搜尋 ----------
// 關鍵句區塊（題目揭曉、結果頁、場次明細共用）。keys = [{page,text}]
function keyLine(k, cls){
  var id = (window._K = window._K || []).push([k.text]) - 1;
  return '<div class="key'+(cls?' '+cls:'')+'">'+esc(k.text)+' <span class="pg">p.'+k.page+'</span>'
       + ' <button class="link" style="padding:0 4px;font-size:13px" onclick="openPage('+k.page+',window._hl=window._K['+id+'])">看整頁 ›</button></div>';
}
// q 需有 keys / page / options（/ perm）；chosen = 使用者選的原始選項編號
// keys 內沒有 opt 的是支撐正確答案的句子；有 opt 的是「其他選項為什麼不是答案」（opt=0 時用 label，例如「陳述 B」）
function keysHtml(q, chosen){
  var all = q.keys || [];
  var keys = all.filter(function(k){ return k.opt === undefined || k.opt === null; });
  var wrong = all.filter(function(k){ return k.opt !== undefined && k.opt !== null; });
  var h = '<div class="keys"><div class="t">教材原文（支撐答案的句子，底色為標記處）</div>';
  if (keys.length) keys.forEach(function(k){ h += keyLine(k); });
  else h += '<div class="muted">這題尚未標記關鍵句。</div>';
  if (wrong.length){
    var perm = q.perm || (q.options||[]).map(function(_,i){ return i; });
    var disp = function(opt){ var i = perm.indexOf(opt-1); return i < 0 ? opt : i+1; };
    var groups = {}, order = [];
    wrong.forEach(function(k){ var g = k.opt ? 'o'+k.opt : 'l'+(k.label||''); if (!groups[g]){ groups[g] = []; order.push(g); } groups[g].push(k); });
    order.sort(function(x,y){ var kx = groups[x][0], ky = groups[y][0];
      var px = kx.opt ? (kx.opt===chosen ? -1 : disp(kx.opt)) : 99, py = ky.opt ? (ky.opt===chosen ? -1 : disp(ky.opt)) : 99; return px - py; });
    h += '<div class="t" style="margin-top:12px">其他選項為什麼不是答案（教材原文）</div>';
    order.forEach(function(g){
      var k0 = groups[g][0], title;
      if (k0.opt){ var txt = String((q.options||[])[k0.opt-1] || ''); if (txt.length > 46) txt = txt.slice(0,46)+'…';
        title = '（'+disp(k0.opt)+'）'+esc(txt)+(k0.opt===chosen ? ' <b style="color:var(--bad)">← 你選的</b>' : ''); }
      else title = esc(k0.label || '其他');
      h += '<div class="wopt">'+title+'</div>';
      groups[g].forEach(function(k){ h += keyLine(k, 'w'); });
    });
  }
  var pages = parsePages(q.page);
  if (pages.length) h += '<div class="muted" style="margin-top:4px">教材出處（點頁碼看整頁）：'
    + pages.map(function(p){ return '<button class="link" style="padding:0 4px;font-size:13px" onclick="openPage('+p+',window._hl=[])">p.'+p+'</button>'; }).join('')+'</div>';
  return h + '</div>';
}
function parsePages(ref){
  var out = []; String(ref||'').replace(/p+\./g,'').split(/[,;]/).forEach(function(part){
    part = part.trim(); if (!/^\d/.test(part)) return;
    if (part.indexOf('-')>0){ var a=part.split('-'); for (var i=+a[0]; i<=+a[1]; i++) out.push(i); } else out.push(+part);
  }); return out;
}
function hlText(text, hls){
  var h = esc(text);
  (hls||[]).filter(Boolean).forEach(function(t){ var e = esc(t); if (e) h = h.split(e).join('<mark>'+e+'</mark>'); });
  return h;
}
// 整頁原文覆蓋層；hl = 要標記的字串陣列
function openPage(page, hl){
  var o = document.getElementById('ovl'); o.className='ovl on';
  o.innerHTML = '<div class="bar"><button onclick="closePage()">‹ 返回</button><b>教材 p.'+page+'</b><span></span></div><div class="spin">載入中…</div>';
  apiGet('page', { subject: state.subject, page: page }).then(function(d){
    var title = (d.chapter?'第 '+d.chapter+' 章 · ':'')+'p.'+d.page+(d.alias?'（第 '+d.requested+' 頁無獨立內文，顯示 p.'+d.page+'）':'');
    o.innerHTML = '<div class="bar"><button onclick="closePage()">‹ 返回</button><b>'+esc(title)+'</b><span></span></div>'
      + '<div class="page">'+hlText(d.text, hl)+'</div>'
      + '<div class="nav"><button '+(d.prev?'':'disabled')+' onclick="openPage('+d.prev+',window._hl)">‹ p.'+(d.prev||'')+'</button>'
      + '<button '+(d.next?'':'disabled')+' onclick="openPage('+d.next+',window._hl)">p.'+(d.next||'')+' ›</button></div>';
    o.scrollTop = 0;
    var m = o.querySelector('mark'); if (m) setTimeout(function(){ m.scrollIntoView({ block:'center' }); }, 50);
  }).catch(function(e){ o.innerHTML = '<div class="bar"><button onclick="closePage()">‹ 返回</button></div><div class="card err">'+esc(e.message||e)+'</div>'; });
}
function closePage(){ var o=document.getElementById('ovl'); o.className='ovl'; o.innerHTML=''; }

// 查教材
function renderSearch(q, data){
  var h = '<h1>查教材 · '+esc(state.subject||'')+'</h1><div class="sub">輸入關鍵字，找出教材裡出現的頁面（多個字以空格分開表示都要出現）</div>'
        + '<div class="card"><div class="sr"><input type="text" id="sq" placeholder="例如：逆選擇、可保利益" value="'+esc(q||'')+'" onkeydown="if(event.key===\'Enter\')doSearch()"><button class="primary" onclick="doSearch()">搜尋</button></div></div>';
  if (data){
    h += '<div class="muted" style="margin:4px 0 8px">找到 '+data.total+' 頁'+(data.total>50?'（只顯示前 50 頁）':'')+'</div>';
    if (!data.results.length) h += '<div class="card muted">沒有找到「'+esc(data.q)+'」</div>';
    window._SQ = data.q.split(/\s+/);
    data.results.forEach(function(r){
      h += '<div class="card hit" onclick="openPage('+r.page+',window._hl=window._SQ)">'
         + '<div class="row" style="justify-content:space-between"><b>p.'+r.page+'</b><span class="muted">'+(r.chapter?'第 '+r.chapter+' 章 · ':'')+'出現 '+r.count+' 次</span></div>'
         + '<div class="sn">'+hlText(r.snippet, [data.q.split(/\s+/)[0]])+'</div></div>';
    });
  }
  $(h,'book');
  if (!data){ var el=document.getElementById('sq'); if (el && !q) el.focus(); }
}
function doSearch(){
  var q = (document.getElementById('sq').value||'').trim();
  if (q.length < 2) return;
  $('<div class="spin">搜尋中…</div>','book');
  apiGet('search', { subject: state.subject, q: q }).then(function(d){ renderSearch(q, d); }).catch(function(e){ renderSearch(q, { q:q, total:0, results:[] }); alert(e.message||e); });
}

// ---------- PWA ----------
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function(){}); }

loadHome();
</script>
